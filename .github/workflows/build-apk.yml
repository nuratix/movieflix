name: Build Android APK (GitHub Cloud)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" -x lint -x test

      - name: Prepare APK Output
        run: |
          mkdir -p output
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found in android/app/build/outputs/apk/release"
            find android/app/build/outputs/ -type f || true
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" output/movieflix-v1.1.2.apk
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: movieflix-v1.1.2-apk
          path: output/movieflix-v1.1.2.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.2
          name: Movieflix v1.1.2
          draft: false
          prerelease: false
          body: |
            ### 🎬 Movieflix v1.1.2 Release APK

            Built automatically via **GitHub Actions Cloud**!

            #### 🔒 Security & Enhancements in v1.1.2:
            * **Server-Side Security & Anti-Tamper**: Enforced v1.1.2 official build fingerprint verification and signature validation.
            * **SSRF Hardening**: Edge & Node streaming proxy hardened against SSRF, internal loopback, and metadata address exploitation.
            * **Database Information Disclosure Protection**: Sanitized database error reporting in authentication pipelines.
            * **Minimal Privacy Screen**: Streamlined privacy policy screen with external system browser launching in native APK.
            * **Auto-Update Engine**: Pointed to latest authenticated GitHub Release assets with direct APK download and background installation.
            * **Hardware Media Controls**: Smooth vertical touch gestures for device brightness and ExoPlayer audio volume.
          files: |
            output/movieflix-v1.1.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
