name: Build Android APK (GitHub Cloud)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_API_BASE: https://mws.wallpaperdomain.xyz

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" -x lint -x test
        env:
          EXPO_PUBLIC_API_BASE: https://mws.wallpaperdomain.xyz

      - name: Prepare APK Output
        id: prepare_apk
        run: |
          mkdir -p output
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found in android/app/build/outputs/apk/release"
            find android/app/build/outputs/ -type f || true
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "Found APK at: $APK_PATH for version $VERSION"
          cp "$APK_PATH" "output/movieflix-v${VERSION}.apk"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: movieflix-v${{ steps.prepare_apk.outputs.version }}-apk
          path: output/movieflix-v${{ steps.prepare_apk.outputs.version }}.apk
          retention-days: 7

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prepare_apk.outputs.version }}
          name: Movieflix v${{ steps.prepare_apk.outputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ### 🎬 Movieflix v${{ steps.prepare_apk.outputs.version }} Official Production Release APK

            Official Production Build via **GitHub Actions Cloud**!

            #### 🚀 Release Notes (v${{ steps.prepare_apk.outputs.version }}):
            * **Search Pagination & Load More**: Full search pagination support with `+More` pill in search bar capsule, header load more button, and bottom grid "Load More Search Results" button. Auto-deduplicated.
            * **Shorts Catalog Previews & Watch This**: Direct middle-portion 1-2 min preview clips for movies and web series with instant "Watch This" play page redirect and database-synced likes.
            * **Player Episode Selector Sheet**: Clean bottom sheet displaying all episode numbers and season tabs, with instant loading indicator on episode switch.
            * **Single Silent Download Notification**: Clean progress bar notification without repetitive sound spam or multiple notification alerts.
            * **Ultra-Smooth Video Seeker & Player**: Zero lag scrubber bar with debounced seeking.
            * **Maintenance & Emergency Donate Gates**: Centralized status checks for high availability.
          files: |
            output/movieflix-v${{ steps.prepare_apk.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
