name: Build Android APK (GitHub Cloud)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_API_BASE: https://movieflix-pi-six.vercel.app

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" -x lint -x test
        env:
          EXPO_PUBLIC_API_BASE: https://movieflix-pi-six.vercel.app

      - name: Prepare APK Output
        id: prepare_apk
        run: |
          mkdir -p output
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found in android/app/build/outputs/apk/release"
            find android/app/build/outputs/ -type f || true
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "Found APK at: $APK_PATH for version $VERSION"
          cp "$APK_PATH" "output/movieflix-v${VERSION}.apk"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: movieflix-v${{ steps.prepare_apk.outputs.version }}-apk
          path: output/movieflix-v${{ steps.prepare_apk.outputs.version }}.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prepare_apk.outputs.version }}
          name: Movieflix v${{ steps.prepare_apk.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ### 🎬 Movieflix v${{ steps.prepare_apk.outputs.version }} Official Release APK

            Built automatically via **GitHub Actions Cloud**!

            #### 🚀 What's New & Fixed in v${{ steps.prepare_apk.outputs.version }}:
            * **Home Screen Widget Portrait Posters**: Bundled official high-definition portrait posters (Wednesday, Squid Game, Money Heist) with signature red ambient glow and zero cutoff.
            * **Horizontal Season Scroll**: Season selection pill bar is now smoothly scrollable horizontally to easily browse all seasons.
            * **"Me" Tab Notification Dot Fix**: Red indicator badge automatically and permanently dismisses when navigating to the Me tab.
            * **In-App Updater Package Parsing Fix**: Hardened package integrity checks (>5MB) and direct CDN routing to ensure smooth updates without Android parsing errors.
            * **EAS Updates Always-Check Channel**: Instant OTA sync configured for future seamless hotfixes.
          files: |
            output/movieflix-v${{ steps.prepare_apk.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
